[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-local-governance"
version = "0.1.0"
description = "Offline metadata-only manifests and hash-bound contract validation"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.35,<1", "rfc3339-validator>=0.1.4,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
local-governance = "portable_local_tools:main"
governance-contract = "contract_integrity:main"

[tool.setuptools]
py-modules = ["portable_local_tools", "contract_integrity"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["governance_assets*"]
namespaces = true

[tool.setuptools.package-data]
governance_assets = ["schemas/*.json", "src/*.py", "portability/schemas/*.json"]
